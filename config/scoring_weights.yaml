# Trong so cho Augment Scoring Engine - SPEC 3.5.4
#
# File nay TON TAI de ablation study (SPEC 12.4) tat duoc tung thanh phan ma
# khong sua mot dong code nao. Dung bao gio hardcode cac so nay vao Python.
#
# Gia tri khoi tao la GIA DINH TIEN NGHIEM, chua duoc fit tren du lieu nao.
# Phai noi ro dieu do trong bao cao: chung se duoc hieu chinh sau khi
# ScenarioLogger tich luy du dataset (SPEC 12.2).

weights:
  base: 0.30       # w1 - so lieu tinh tu StatsProvider
  board_fit: 0.30  # w2 - trung trait / khop carry type
  econ_fit: 0.15   # w3 - gia tri econ x do hop stage
  item_fit: 0.15   # w4 - component duoc tang vs item dang thieu
  tempo_fit: 0.10  # w5 - greed theo HP

# Tham so cua tung thanh phan. Tach khoi `weights` de ablation chi cham vao
# `weights` va khong vo tinh doi hanh vi noi tai cua component.
tuning:
  base:
    # Khoang placement dung de chuan hoa: 3.5 (rat tot) -> 5.0 (rat te).
    best_place: 3.5
    worst_place: 5.0
    # Duoi nguong co mau nay, diem bi keo ve trung tinh thay vi tin tuong.
    min_sample_n: 200
    # Muc tin cho tin hieu THU TU (bang tier do nguoi xep, khong co co mau).
    #
    # NANG 0.35 -> 0.65 (2026-09-07). 0.35 duoc dat khi bang tier chi la
    # phuong an DU PHONG dung sau so lieu do duoc. Riot da go truong `augments`
    # o Set 18 va khong nguon cong khai nao con cap, nen bang tier do nguoi
    # xep gio la nguon DUY NHAT cua w1 - de o 0.35 nghia la 30% tong diem chi
    # dong gop mot phan ba bien do cua no.
    #
    # KHONG dat 1.0, va do la co y: day van la mot Y KIEN. Phan co ngot chinh
    # la cho trung thuc cua thiet ke. `is_ordinal` van True, `is_evidence` van
    # False, va reason string van noi ro day khong phai so do.
    #
    # 0.65 la mot lua chon, chua fit tren du lieu nao. No la mot truc ablation:
    # do do nhay cua xep hang theo {0.2, 0.35, 0.65, 1.0} roi bao cao.
    ordinal_trust: 0.65
    # Diem cho loi chua biet / chua co data/tier list chinh xac.
    # Dat 0.35 (duoi bac B = 0.370) de phat rui ro thieu thong tin, tao dong co reroll.
    unknown_score: 0.35
  board_fit:
    trait_weight: 0.6
    carry_weight: 0.4
    # So unit cua mot trait tro len thi coi la dang theo trait do.
    active_trait_min_units: 2
  econ_fit:
    # He so theo stage: econ som con thoi gian sinh loi, econ muon thi khong.
    stage_curve: [1.0, 1.0, 0.8, 0.5, 0.25, 0.1]
  item_fit:
    # Diem cho component khop dung thu dang thieu vs component bat ky.
    exact_component: 1.0
    generic_component: 0.6
    completed_item: 0.8
  tempo_fit:
    # Duoi nguong HP nay thi scaling bi phat nang - khong con thoi gian de no lon.
    low_hp: 35
    high_hp: 70

# Comp Selection Algorithm - SPEC 3.5.2. De o day (khong hardcode) vi cung ly
# do voi `weights`: phai doi duoc tu file khi hieu chinh hoac khi ablation.
comp_selector:
  unit: 0.40
  item: 0.25
  meta: 0.23
  augment: 0.12
  # contest_score chi khac 0 khi enable_scouting = true (Phase 7). Khi scouting
  # tat, thanh phan nay bang 0 va cac trong so tren giu nguyen y het.
  contest: 0.20
  stability:
    # Trung khuyen nghi truoc do va con du tot -> thuong, de tranh pivot vo co.
    same_direction_bonus: 0.15
    same_direction_min_score: 0.60
    # Pivot ma phai ban qua nhieu unit -> phat.
    pivot_penalty: 0.10
    pivot_sell_threshold: 3
    # Duoi nguong nay thi comp hien tai bi danh dau la nen doi huong.
    pivot_flag_below: 0.30

# Chinh sach reroll augment - SPEC 3.5.5. Cung ly do de o day voi `weights`:
# ablation phai bat/tat duoc tu file.
reroll_policy:
  # Thoa dung mu: >0 ngai rui ro, <0 ua rui ro, 0 trung lap.
  # MAC DINH 0 CO CHU DICH. Anh huong cua HP len GIA TRI cua augment da nam o
  # tempo_fit (low_hp/high_hp); dua HP vao ca nguong dung nua la dem hai lan.
  risk_lambda: 0.0

  # Trong so tailoring: TFT chao uu tien augment trung trait dang bat, nen coi
  # pool la deu se danh gia THAP gia tri cua mot lan doi va lam may so reroll
  # mot cach nhan tao. `w = 1 + beta` neu trung trait, `1` neu khong.
  # beta = 0 tra ve phan bo deu - nhanh doi chung cua ablation.
  tailoring_beta: 1.0

  # GIA DINH, chua nguon cong khai nao xac nhan: augment da hien ra (ke ca bi
  # doi di) bi go khoi pool cua nguoi choi o cac chang sau.
  # Xem docs/augment-reroll/mechanics-assumptions.md truoc khi tin so nay.
  burn_on_reveal: true

  # DON VI cua cost_matrix. `sigma` = boi cua do lech chuan diem cua chinh
  # pool do; `absolute` = don vi diem tho.
  # PHAI la sigma: do 2026-09-07 cho thay sd(Score) tren mot bac chi ~0,05 va
  # tich phan duoi voi the dan dau thuc te chi 0,002-0,009. Doc bang so duoi
  # day nhu tuyet doi thi MOI o deu lon hon moi loi ich co the co -> khong bao
  # gio doi the, trai han y do. Doc nhu boi sigma thi chung roi dung cho.
  cost_unit: sigma

  # c(tier, stage) - gia phai tra cho viec lo them mot the, tinh theo sigma.
  # DAY LA TIEN NGHIEM DO NGUOI DAT, KHONG PHAI SO DO. Lap luan sinh ra hinh
  # dang cua bang nam o docs/augment-reroll/depletion-cost.md:
  #   - prismatic pool nho nhat (60) va so augment S-tier cho mot loi choi chi
  #     3-5 cai -> lo them mot the tot ma khong lay duoc la dot that.
  #   - gold (132) / silver (62) pool lon -> dot ~1%, khong dang ke.
  #   - chang 4-2 la chang cuoi: khong con gi de dot, c = 0 tuyet doi.
  cost_matrix:
    prismatic: {stage_2: 0.08, stage_3: 0.04, stage_4: 0.00}
    gold:      {stage_2: 0.01, stage_3: 0.01, stage_4: 0.00}
    silver:    {stage_2: 0.01, stage_3: 0.01, stage_4: 0.00}
