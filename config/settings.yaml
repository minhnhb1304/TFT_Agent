# Cau hinh runtime - SPEC 5
#
# Moi co o day deu MAC DINH AN TOAN: tat cai gi chua chung minh duoc, chu
# khong bat cai gi chua kip tat.

paths:
  augment_features: data/augment_features.json
  augment_stats_csv: data/augment_stats.csv     # co the chua ton tai -> NullProvider
  augment_tiers: data/augment_tiers.json        # bang tier do NGUOI xep, chi la thu tu
  scoring_weights: config/scoring_weights.yaml
  # Doi sang data/meta_comps_tactics.json de dung so cua tactics.tools (co mau
  # trieu van, nhung khong truy nguoc duoc). Mac dinh la file TU CRAWL.
  meta_comps: data/meta_comps.json              # co the chua ton tai -> comp DB rong
  item_recipes: data/item_recipes.json          # SINH RA tu locale, khong sua tay
  name_index: data/name_index.json              # SINH RA boi scripts/build_name_index.py
  scenarios: data/scenarios
  cdragon_cache: data/cdragon_cache             # SINH RA boi scripts/fetch_locale.py

locale:
  # vi_vn. TUYET DOI khong dung vn_vn (bay so 1 trong research/set-data.md).
  language: vi_vn
  branch: latest

riot:
  # Nguon cho scripts/crawl_augment_stats.py. CHI dung luc sinh du lieu
  # offline - runtime khong bao gio goi Riot API (SPEC 3.5.3: khong co gi
  # cham mang nam tren duong quyet dinh 30 giay).
  #
  # vn2 = server DTCL Viet Nam, thuoc cum regional `sea` cho match-v1.
  platform: vn2
  # Hang cao: quyet dinh augment chat luong hon, va du it nguoi de crawl het
  # trong gioi han cua Personal Key (100 request / 2 phut).
  tiers: [challenger, grandmaster, master]

hotkeys:
  # BAT BUOC dung RegisterHotKey cua Win32 goi tu Qt (SPEC 1.3, feedback #10):
  # co che cap OS, KHONG cai hook WH_KEYBOARD_LL, KHONG can quyen admin. Thu
  # vien `keyboard` lam nguoc lai ca hai -> dung loai hanh vi anti-cheat de y.
  # De trong ("") de tat mot binding.
  toggle_visibility: F1
  toggle_click_through: F2
  force_refresh: F3
  toggle_detail: F4
  quit: Ctrl+Q

capture:
  # Chup THEO CUA SO game, khong chup ca desktop. Day la mac dinh va la lua
  # chon co y (danh gia rui ro 2026-09-04, research/vanguard/):
  #   - Chup theo cua so khong lay overlay cua tien trinh khac -> vong lap
  #     "vision doc lai chu cua chinh minh" khong hinh thanh ve mat cau truc,
  #     khong can SetWindowDisplayAffinity de chua.
  #   - Tranh luon syscall Desktop Duplication (NtGdiDdDDIOutputDuplGetFrameInfo)
  #     ma vgk.sys co hook. Khong co bang chung hook do dung de phat hien, nhung
  #     khong co ly do phai di qua no khi co duong khac.
  window_scoped: true

  # SetWindowDisplayAffinity(WDA_EXCLUDEFROMCAPTURE) tren overlay CUA CHINH TA.
  # MAC DINH TAT. Chi bat khi window_scoped khong dung duoc, va khi do phai
  # chap nhan: day la loi goi duy nhat trong stack co hinh dang giong ne tranh
  # (doc duoc "from any process", vgk.sys hook NtUserGetWindowDisplayAffinity,
  # TAC cua Activision thu thap va gui gia tri nay ve server).
  overlay_capture_protection: false

  # ROI cua OCR phai KHONG giao voi vung overlay. tools/calibrate.py se assert
  # dieu nay - bien mot quy uoc bo tri thanh mot bat bien kiem chung duoc.
  assert_roi_disjoint_from_overlay: true

features:
  # Phase 7 - doc board doi thu. MAC DINH TAT: khoi luong CV lon, do nhieu cao,
  # va no khong duoc phep an vao thoi gian cua Augment Advisor (SPEC 3.3).
  enable_scouting: false

  # Vai tro B cua LLM (SPEC 3.5.3): chi lam muot cau chu, KHONG duoc doi thu hang.
  enable_llm_refinement: false
  llm_model: gemini-3.5-flash-lite
  llm_hard_timeout_s: 2.0

  # Roll odds Set 18 chua public (SPEC 3.4.2). Bat co nay = chap nhan hien so
  # cua cac set truoc kem nhan "chua xac minh".
  allow_unverified_roll_odds: false

logging:
  # ScenarioLogger ship o Phase 3 chu khong phai cuoi: SPEC 12.2/12.3/12.4 dung
  # chung mot dataset do no sinh ra.
  log_scenarios: true
  # Luu anh frame ben canh JSON. Ton dia, nhung 12.1 can frame de gan nhan.
  save_frames: false
